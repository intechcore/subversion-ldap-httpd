#
# beta-project: restricted to admins and devs only, others denied
#

<Location /beta-project>
    DAV svn
    AuthType Basic
    AuthName "Subversion Repository"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/htpasswd
    SVNListParentPath on
    LimitXMLRequestBody 0
    LimitRequestBody 0

    SVNParentPath /svn/repos/beta-project
    AuthzSVNAccessFile /svn/authz/beta-project.authz

    Require valid-user
</Location>
