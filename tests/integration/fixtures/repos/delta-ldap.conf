#
# delta-ldap: authentication against the LDAP server of the test setup
#

<Location /delta-ldap>
    DAV svn
    AuthType Basic
    AuthName "Subversion Repository"
    AuthBasicProvider ldap
    AuthLDAPURL "ldap://ldap:389/ou=people,dc=example,dc=org?uid"
    AuthLDAPBindDN "cn=readonly,dc=example,dc=org"
    AuthLDAPBindPassword "readonly-pw"
    SVNPath /svn/repos/delta-ldap

    Require valid-user
</Location>
