#
# alpha-project: read-write for admins and devs, read-only for viewers
#

<Location /alpha-project>
    DAV svn
    AuthType Basic
    AuthName "Subversion Repository"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/htpasswd
    SVNListParentPath on
    LimitXMLRequestBody 0
    LimitRequestBody 0

    SVNParentPath /svn/repos/alpha-project
    AuthzSVNAccessFile /svn/authz/alpha-project.authz

    Require valid-user
</Location>
