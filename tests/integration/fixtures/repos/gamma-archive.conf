#
# gamma-archive: read-only archive, selective access
#

<Location /gamma-archive>
    DAV svn
    AuthType Basic
    AuthName "Subversion Repository"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/htpasswd
    SVNListParentPath on
    LimitXMLRequestBody 0
    LimitRequestBody 0

    SVNParentPath /svn/repos/gamma-archive
    AuthzSVNAccessFile /svn/authz/gamma-archive.authz

    Require valid-user
</Location>
